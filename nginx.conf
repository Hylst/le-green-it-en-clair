server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Service worker : jamais mis en cache longuement (sinon mises à jour bloquées)
    location = /greenit/sw.js {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing - handle client-side routing
    location /greenit/ {
        try_files $uri $uri/ =404;
        error_page 404 /greenit/404.html;
    }

    # Handle the path without trailing slash
    location /greenit {
        return 301 /greenit/;
    }

    # Optional: Redirect root to /greenit/
    location = / {
        return 301 /greenit/;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Pas de CSP stricte ici : le site utilise des scripts inline (thème, service worker)
    # qu'une CSP casserait sans hash. Caméra/micro/paiement désactivés, le reste inchangé.
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=()" always;

    # Error pages
    error_page 404 /greenit/404.html;
    error_page 500 502 503 504 /50x.html;
}
